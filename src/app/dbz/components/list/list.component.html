<h4>Listado</h4>
<ul class="list-group">
  <li *ngFor="let item of characterList; index as i ; first as first; odd as esImpar; let esUltimo = last "
    class="list-group-item d-flex justify-content-between align-items-center"
    [ngClass]="{
      'list-group-item-success': esImpar ,
      'list-group-item-warning': esUltimo
    }"
    >


      <!-- <span>{{i+1}}.</span>
      <span> Es el primero:{{first}}-</span>
      <span> Es el ultimo:{{esUltimo}}-</span> -->

        <span> {{item.name}} -<b>Power: {{item.power}}</b> </span>

        <!-- <button class="btn btn-danger" (click)="onDeletePersonaje(i)">X</button> -->
        <button class="btn btn-danger" (click)="onDeletePersonajePorId(item.id!)">X</button>

  </li>

</ul>
